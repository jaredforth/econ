# Each tier is any LiteLLM model string, set in .env as THRIFT_SIMPLE / THRIFT_MODERATE / THRIFT_HARD.
# See .env.example for a Bedrock set and an all-local (Ollama) set.
model_list:
  - {model_name: simple,   litellm_params: {model: os.environ/THRIFT_SIMPLE}}
  - {model_name: moderate, litellm_params: {model: os.environ/THRIFT_MODERATE}}
  - {model_name: hard,     litellm_params: {model: os.environ/THRIFT_HARD}}
  - {model_name: auto,     litellm_params: {model: os.environ/THRIFT_MODERATE}}  # placeholder, hook rewrites it
litellm_settings:
  callbacks: hook.router
